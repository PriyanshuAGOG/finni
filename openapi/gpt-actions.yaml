      summary: Draft content from library sources with citations
      description: >-
        Drafts content (blog article, patient guide, FAQ, video script, social post, newsletter,
        training notes, presentation outline, or research summary) built from cited library
        passages.


        Defaults to approved sources only (source_policy approved_only). Using approved_preferred or
        any_internal includes unreviewed material and the response will flag it; do not publish that
        as approved Nirog Bhoomi guidance without review.


        Every factual statement in the body carries a citation marker verified against the retrieval
        context; anything the model could not support is returned separately as unsupported_claims
        rather than left uncited in the body. Health-facing content requires review by a qualified
        reviewer before publication -- always say so.


