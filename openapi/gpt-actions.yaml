  /content/{contentId}/validate:
    post:
      operationId: validateContentCitations
      summary: Check a content draft's statements against its cited sources
      description: >-
        Independently re-checks each cited statement in a content draft against the text of the
        passage it cites, and flags any factual statement carrying no citation at all.


        Returns supported, weakly supported and unsupported statements, citation marker mismatches,
        and safety review flags including absolute or guaranteeing language. Use this before
        recommending that content be published, and always surface unsupported or weakly supported
        statements to the user.


