                        - vancouver
                        - harvard
                        - url_list
                        - doi_list
                        - bibtex
                        - ris
                include_safety_notes:
                  anyOf:
                    - not: {}
                    - type: boolean
                brand_guidance:
                  anyOf:
                    - not: {}
