          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /confirmations/{confirmationId}/confirm:
    post:
      operationId: confirmAction
      summary: Confirm a previously requested high-risk action
      description: Marks a confirmation as confirmed using the exact phrase requestActionConfirmation
        returned -- never guess or paraphrase it. Call only after the user has clearly agreed to the
        shown summary. The confirmation_id can then be used once with the original operation.
      tags:
        - confirmations
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes: []
      parameters:
        - name: confirmationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
