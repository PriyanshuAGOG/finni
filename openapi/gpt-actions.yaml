components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: Credential (prefix nbgpt_) that acts as a constrained, pre-authorized user, created via
        Settings -> Connect a Custom GPT.
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
            - retryable
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - INVALID_INPUT
                - VALIDATION_FAILED
                - NOT_FOUND
                - CONFLICT
                - DUPLICATE_SOURCE
                - CONFIRMATION_REQUIRED
                - CONFIRMATION_EXPIRED
                - RATE_LIMITED
                - PROCESSING
                - EXTRACTION_FAILED
                - AI_PROCESSING_FAILED
                - EXTERNAL_SEARCH_FAILED
                - JOB_NOT_CANCELLABLE
                - SOURCE_LOCKED
                - FIELD_LOCKED
                - VERSION_CONFLICT
                - IDEMPOTENCY_CONFLICT
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - NOT_IMPLEMENTED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
            retryable:
              type: boolean
            suggested_action:
              type: string
    ResponseMeta:
      type: object
      properties:
        request_id:
          type: string
        operation:
          type: string
        duration_ms:
          type: number
        source:
          type: string
          enum:
            - internal_approved
            - internal_unreviewed
            - internal_archived
            - external_web
            - mixed
          description: Where the returned information originated.
    Pagination:
      type: object
      properties:
        next_cursor:
          type:
            - string
            - "null"
        has_more:
          type: boolean
        limit:
          type: integer
