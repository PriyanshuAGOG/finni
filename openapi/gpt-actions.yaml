components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: User-specific access via the authorization code flow (with PKCE).
      flows:
        authorizationCode:
          authorizationUrl: https://research.nirogbhoomi.com/oauth/authorize
          tokenUrl: https://research.nirogbhoomi.com/oauth/token
          scopes:
            profile.read: profile read
            knowledge.read: knowledge read
            source.read: source read
            source.write: source write
            source.review: source review
            collection.read: collection read
            collection.write: collection write
            taxonomy.read: taxonomy read
            taxonomy.write: taxonomy write
            claim.read: claim read
            claim.write: claim write
            claim.review: claim review
            annotation.read: annotation read
            annotation.write: annotation write
            research.run: research run
            brief.read: brief read
            brief.write: brief write
            content.generate: content generate
            audit.read: audit read
            admin.integrations: admin integrations
    ApiKey:
      type: http
      scheme: bearer
      description: Prototype credential (prefix nbgpt_) that acts as a constrained, pre-authorized user.
        Use OAuth2 for production deployments.
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
            - retryable
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - INVALID_INPUT
                - VALIDATION_FAILED
                - NOT_FOUND
                - CONFLICT
                - DUPLICATE_SOURCE
                - CONFIRMATION_REQUIRED
                - CONFIRMATION_EXPIRED
                - RATE_LIMITED
                - PROCESSING
                - EXTRACTION_FAILED
                - AI_PROCESSING_FAILED
                - EXTERNAL_SEARCH_FAILED
                - JOB_NOT_CANCELLABLE
                - SOURCE_LOCKED
                - FIELD_LOCKED
                - VERSION_CONFLICT
                - IDEMPOTENCY_CONFLICT
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - NOT_IMPLEMENTED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
            retryable:
              type: boolean
            suggested_action:
              type: string
    ResponseMeta:
      type: object
      properties:
        request_id:
          type: string
        operation:
          type: string
        duration_ms:
          type: number
        source:
          type: string
          enum:
            - internal_approved
            - internal_unreviewed
            - internal_archived
            - external_web
            - mixed
          description: Where the returned information originated.
    Pagination:
      type: object
      properties:
        next_cursor:
          type:
            - string
            - "null"
        has_more:
          type: boolean
        limit:
          type: integer
