      description: >-
        Marks candidates as included or excluded, with a reason for each exclusion. When
        ingest_included is true, included candidates are saved to the library via the normal
        ingestion path and added to the job's collection if one exists.


        Do not select and ingest every candidate automatically unless the user has given clear
