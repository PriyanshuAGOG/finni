openapi: 3.1.0
info:
  title: Nirog Bhoomi Research OS -- Custom GPT Actions
  version: 1.0.0
  description: The subset of the Nirog Bhoomi Research OS API exposed to the Nirog Bhoomi Research
    Assistant Custom GPT. Every write is permission-checked, scope-checked and audit-logged
    identically to the dashboard.
servers:
  - url: https://research.nirogbhoomi.com/api/v1
    description: Production
security:
  - ApiKey: []
tags:
  - name: audit
  - name: briefs
  - name: claims
  - name: collections
  - name: confirmations
  - name: content
  - name: ingestion
  - name: knowledge
  - name: profile
  - name: research
  - name: review
  - name: sources
  - name: taxonomy
paths:
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user, their roles and their effective permissions
      description: Returns this connection's identity, roles, granted scopes and effective permissions.
        Use before assuming a permission the user hasn't been shown to hold. Does not modify
        anything.
      tags:
        - profile
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - profile.read
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /knowledge/search:
    post:
      operationId: searchKnowledge
      summary: Search the internal library with natural language and structured filters
      description: Hybrid search (full-text, semantic, taxonomy, evidence-weighted) over internal sources,
        claims, collections and briefs. Search before synthesizing. Returns passages with locators,
        never web results. Every result states origin (approved/unreviewed/archived) -- never call
        unreviewed approved.
      tags:
        - knowledge
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - knowledge.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  minLength: 1
                  description: The natural-language question or search terms.
                mode:
                  anyOf:
                    - not: {}
                    - type: string
                      enum:
                        - library_only
                        - library_first
                        - web_discovery
                        - evidence_review
                  description: library_only restricts to approved internal sources by default.
                entity_types:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        enum:
                          - sources
                          - claims
                          - collections
                          - annotations
                          - briefs
                  description: Which record types to search. Defaults to sources.
                filters:
                  anyOf:
                    - not: {}
                    - type: object
                      properties:
                        review_status:
                          type: array
                          items:
                            type: string
                            enum:
                              - unreviewed
                              - needs_review
                              - in_review
                              - approved
                              - approved_with_conditions
                              - rejected
                              - disputed
                              - superseded
                        source_types:
                          type: array
                          items:
                            type: string
                        study_designs:
                          type: array
                          items:
                            type: string
                        categories:
                          type: array
                          items:
                            type: string
                            format: uuid
                        tags:
                          type: array
                          items:
                            type: string
                            format: uuid
                        collection_ids:
                          type: array
                          items:
                            type: string
                            format: uuid
                        source_ids:
                          type: array
                          items:
                            type: string
                            format: uuid
                        authors:
                          type: array
                          items:
                            type: string
                        publishers:
                          type: array
                          items:
                            type: string
                        published_after:
                          type: string
                          nullable: true
                        published_before:
                          type: string
                          nullable: true
                        population:
                          type: string
                          nullable: true
                        intervention:
                          type: string
                          nullable: true
                        comparator:
                          type: string
                          nullable: true
                        outcome:
                          type: string
                          nullable: true
                        country:
                          type: string
                          nullable: true
                        language:
                          type: string
                          nullable: true
                        evidence_status:
                          type: array
                          items:
                            type: string
                            enum:
                              - supported
                              - likely_supported
                              - mixed
                              - contested
                              - contradicted
                              - insufficient_evidence
                              - outdated
                              - retracted_source_dependency
                              - unreviewed
                      additionalProperties: false
                limit:
                  anyOf:
                    - not: {}
                    - type: integer
                      minimum: 1
                      maximum: 50
                include_passages:
                  anyOf:
                    - not: {}
                    - type: boolean
                  description: Return matching passages with locators.
                include_unreviewed:
                  anyOf:
                    - not: {}
                    - type: boolean
                  description: Include sources that have not been approved. They are labelled as such.
                include_archived:
                  anyOf:
                    - not: {}
                    - type: boolean
                explain_ranking:
                  anyOf:
                    - not: {}
                    - type: boolean
                  description: Return the per-signal score breakdown.
              required:
                - query
            example:
              query: What evidence do we have on post-meal walking and glucose?
              mode: library_only
              entity_types:
                - sources
                - claims
              filters:
                review_status:
                  - approved
              limit: 20
              include_passages: true
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /knowledge/synthesize:
    post:
      operationId: synthesizeKnowledge
      summary: Generate a cited answer from internal sources only
      description: Produces a cited answer built only from internal sources; citations not matching a real
        retrieved passage are stripped. Search first unless you already hold source ids. Defaults to
        approved sources only; unreviewed material must be labeled as such if included.
      tags:
        - knowledge
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - knowledge.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  minLength: 1
                mode:
                  anyOf:
                    - not: {}
                    - type: string
                      enum:
                        - library_only
                        - library_first
                        - evidence_review
                source_ids:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
                  description: Restrict to these sources.
                collection_ids:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
                approved_only:
                  anyOf:
                    - not: {}
                    - type: boolean
                  description: Defaults to true.
                include_contradictions:
                  anyOf:
                    - not: {}
                    - type: boolean
                include_limitations:
                  anyOf:
                    - not: {}
                    - type: boolean
                include_safety_notes:
                  anyOf:
                    - not: {}
                    - type: boolean
                citation_style:
                  anyOf:
                    - not: {}
                    - type: string
                      enum:
                        - internal
                        - numbered
                        - apa
                        - vancouver
                        - harvard
                        - url_list
                        - doi_list
                        - bibtex
                        - ris
                audience:
                  anyOf:
                    - not: {}
                    - type: string
                max_sources:
                  anyOf:
                    - not: {}
                    - type: integer
                      minimum: 1
                      maximum: 30
              required:
                - question
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /knowledge/evidence:
    post:
      operationId: findEvidence
      summary: Find supporting, contradicting or qualifying evidence for a claim or question
      description: Finds evidence for a claim/question, separating human-reviewed claim evidence from
        unreviewed retrieval matches -- say which is which. Does not create or modify claims; use
        createClaim/addClaimEvidence for that.
      tags:
        - knowledge
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - knowledge.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                claim_or_question:
                  type: string
                  minLength: 1
                relationship:
                  anyOf:
                    - not: {}
                    - type: string
                      enum:
                        - supporting
                        - contradicting
                        - qualifying
                        - all
                approved_only:
                  anyOf:
                    - not: {}
                    - type: boolean
                collection_ids:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
                limit:
                  anyOf:
                    - not: {}
                    - type: integer
                      minimum: 1
                      maximum: 50
              required:
                - claim_or_question
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /knowledge/compare:
    post:
      operationId: compareSources
      summary: Compare two to eight sources across methodology dimensions
      description: Side-by-side comparison of 2-8 sources across design, population, intervention,
        outcomes, funding and conflicts of interest. Flags whether metadata was human-verified or
        auto-extracted. Does not modify anything.
      tags:
        - knowledge
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - knowledge.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 2
                  maxItems: 8
                comparison_dimensions:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
              required:
                - source_ids
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sources:
    get:
      operationId: listSources
      summary: List and filter library sources
      description: Filtered, paginated browse of sources by review/processing state. For relevance-ranked
        topic search use searchKnowledge instead. Does not modify anything.
      tags:
        - sources
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - source.read
        - knowledge.read
      parameters:
        - name: query
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: review_status
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - allOf:
                  - anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  - type: array
                    items:
                      type: string
                      minLength: 1
        - name: processing_status
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - allOf:
                  - anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  - type: array
                    items:
                      type: string
                      minLength: 1
        - name: source_type
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - allOf:
                  - anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  - type: array
                    items:
                      type: string
                      minLength: 1
        - name: category_id
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: tag_id
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: collection_id
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: publisher
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: author
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: published_after
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: published_before
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: added_by
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: assigned_reviewer_id
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: archived
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: duplicates_only
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: limit
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: integer
                minimum: 1
                maximum: 100
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                enum:
                  - created_at
                  - updated_at
                  - publication_date
                  - title
        - name: order
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                enum:
                  - asc
                  - desc
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createSource
      summary: Create a source from supplied text rather than a URL
      description: Creates a source from text you already have (pasted article, manual note, no fetchable
        URL). For a URL use ingestUrl instead. Writes; approved immediately.
      tags:
        - sources
        - ingestion
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - source.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                source_type:
                  anyOf:
                    - not: {}
                    - type: string
                  description: Defaults to manual_note.
                text:
                  type: string
                  minLength: 1
                original_url:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                authors:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                publisher:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                publication_date:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                abstract:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                categories:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
                tags:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                collection_ids:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
              required:
                - title
                - text
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: A client-generated key that makes a retried write safe to repeat.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sources/{sourceId}:
    get:
      operationId: getSource
      summary: Get one source with its metadata, taxonomy and optional detail
      description: "Full record for one source: metadata, review/processing state, and optionally study
        metadata, claims, annotations, versions, activity. Use searchSourcePassages for exact
        passages rather than full text. Does not modify anything."
      tags:
        - sources
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - source.read
        - knowledge.read
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: include_text
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_study_metadata
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_claims
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_annotations
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_versions
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_activity
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateSource
      summary: Correct editable metadata on a source
      description: Updates editable metadata (title, authors, publisher, dates, abstract, summaries,
        findings, limitations) on an existing source. Does not change review status, taxonomy or
        collections -- use those dedicated operations. Locked fields need source.lock_fields.
        Writes.
      tags:
        - sources
      x-risk-level: medium
      x-may-require-confirmation: false
      x-required-scopes:
        - source.write
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version:
                  anyOf:
                    - not: {}
                    - type: integer
                title:
                  anyOf:
                    - not: {}
                    - type: string
                subtitle:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                source_type:
                  anyOf:
                    - not: {}
                    - type: string
                canonical_url:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                doi:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                pmid:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                author_text:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                publisher:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                journal:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                publication_date:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                language:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                country:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                abstract:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                human_summary:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                evidence_summary:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                key_findings:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                limitations:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                safety_notes:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                practical_implications:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                conflicts_of_interest:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                funding_information:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                visibility:
                  anyOf:
                    - not: {}
                    - type: string
                      enum:
                        - private
                        - restricted
                        - organization
                        - selected_collections
                retraction_status:
                  anyOf:
                    - not: {}
                    - type: string
                retraction_reason:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
              required: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sources/{sourceId}/passages/search:
    post:
      operationId: searchSourcePassages
      summary: Find exact passages within one source
      description: Finds best-matching passages with page numbers/locators inside one source. Use for an
        exact quotation or to verify a claim before repeating it -- never paraphrase as a quotation
        or invent a page number. Does not modify anything.
      tags:
        - sources
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - source.read
        - knowledge.read
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  minLength: 1
                limit:
                  anyOf:
                    - not: {}
                    - type: integer
                      minimum: 1
                      maximum: 30
                include_context:
                  anyOf:
                    - not: {}
                    - type: boolean
              required:
                - query
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sources/ingest-url:
    post:
      operationId: ingestUrl
      summary: Save one URL to the library and queue enrichment
      description: Fetches a URL, extracts content, checks duplicates, creates a source and queues
        enrichment. Approved immediately (no review queue) -- mention extraction warnings if
