  /confirmations:
    post:
      operationId: requestActionConfirmation
      summary: Request a server-issued confirmation for a high-risk action
      description: Issues a confirmation record (phrase + expiry) for a high-risk/critical action. Show
        the user the exact returned summary, get explicit agreement, then call confirmAction, then
        retry the original operation with the confirmation_id. Bound to this exact resource set and
        payload.
      tags:
        - confirmations
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action_type:
                  type: string
                  minLength: 1
                resource_type:
                  type: string
                  minLength: 1
                resource_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                action_payload:
                  anyOf:
                    - not: {}
                    - type: object
                      additionalProperties: {}
                human_summary:
                  type: string
                  minLength: 1
              required:
                - action_type
                - resource_type
                - resource_ids
                - human_summary
