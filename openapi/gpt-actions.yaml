              schema:
                $ref: "#/components/schemas/Error"
  /confirmations:
    post:
      operationId: requestActionConfirmation
      summary: Request a server-issued confirmation for a high-risk action
      description: >-
        Issues a confirmation record for a specific action, resource set and payload, returning a
        required confirmation phrase and an expiry time.


        Call this before any high-risk or critical action -- archiving, bulk operations, merges, or
        changing an approved clinical claim. Present the exact summary this returns to the user
        verbatim, obtain their explicit agreement, then call confirmAction, then retry the original
        operation with the returned confirmation_id.


        The confirmation is bound to this exact resource set and payload; it cannot be reused for a
        different action or a different set of records. This operation writes a confirmation record
        but does not perform the underlying action.
      tags:
        - confirmations
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action_type:
                  type: string
                  minLength: 1
                resource_type:
                  type: string
                  minLength: 1
                resource_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                action_payload:
                  anyOf:
                    - not: {}
                    - type: object
                      additionalProperties: {}
                human_summary:
                  type: string
                  minLength: 1
              required:
                - action_type
                - resource_type
                - resource_ids
                - human_summary
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /confirmations/{confirmationId}/confirm:
    post:
      operationId: confirmAction
      summary: Confirm a previously requested high-risk action
      description: >-
        Marks a confirmation as confirmed after the user has explicitly agreed, by supplying the
        exact required phrase.


        Only call this after the user has been shown the confirmation summary and has clearly
        agreed. Do not fabricate or guess the phrase -- use exactly what requestActionConfirmation
        returned. Once confirmed, use the confirmation_id with the original operation; it can only
        be used once.
      tags:
        - confirmations
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes: []
      parameters:
        - name: confirmationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
