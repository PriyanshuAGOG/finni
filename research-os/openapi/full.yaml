openapi: 3.1.0
info:
  title: Nirog Bhoomi Research OS API
  version: 1.0.0
  description: "Complete versioned API for the Nirog Bhoomi Research OS: the dashboard, the internal
    AI assistant, the Custom GPT, and any future integration all call these same operations."
servers:
  - url: https://research.nirogbhoomi.com/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - OAuth2: []
  - ApiKey: []
tags:
  - name: admin
  - name: annotations
  - name: audit
  - name: briefs
  - name: claims
  - name: collections
  - name: confirmations
  - name: content
  - name: ingestion
  - name: knowledge
  - name: processing
  - name: profile
  - name: research
  - name: review
  - name: sources
  - name: taxonomy
paths:
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user, their roles and their effective permissions
      description: >-
        Returns the identity this connection acts as, together with roles, granted scopes, effective
        permissions and preferences.


        Use this when identity or permissions matter to what you are about to do -- for example
        before offering to approve a source or merge categories. Do not assume a permission the user
        has not been shown to hold, and do not use this to work around a FORBIDDEN response.


        This operation does not modify anything.
      tags:
        - profile
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - profile.read
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /knowledge/search:
    post:
      operationId: searchKnowledge
      summary: Search the internal library with natural language and structured filters
      description: >-
        Searches Nirog Bhoomi's own sources, claims, collections, annotations and briefs using
        hybrid retrieval (full-text, semantic, identifier, taxonomy and evidence-weighted ranking).


        Use this whenever the user asks what the organization already knows, asks you to find saved
        research, or asks a substantive topic question that the library may cover. Always search
        before synthesizing, unless you already hold specific source ids.


        This returns retrieval results with matched passages and locators. It does NOT write an
        answer -- use synthesizeKnowledge for that. It does NOT search the web; use
        previewExternalResearch or startResearchJob for external discovery.


        Every result states its origin (internal_approved, internal_unreviewed or
        internal_archived). Never describe an unreviewed result as approved organizational evidence.
        This operation does not modify anything.
      tags:
        - knowledge
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - knowledge.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  minLength: 1
                  description: The natural-language question or search terms.
                mode:
                  anyOf:
                    - not: {}
                    - type: string
                      enum:
                        - library_only
                        - library_first
                        - web_discovery
                        - evidence_review
                  description: library_only restricts to approved internal sources by default.
                entity_types:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        enum:
                          - sources
                          - claims
                          - collections
                          - annotations
                          - briefs
                  description: Which record types to search. Defaults to sources.
                filters:
                  anyOf:
                    - not: {}
                    - type: object
                      properties:
                        review_status:
                          type: array
                          items:
                            type: string
                            enum:
                              - unreviewed
                              - needs_review
                              - in_review
                              - approved
                              - approved_with_conditions
                              - rejected
                              - disputed
                              - superseded
                        source_types:
                          type: array
                          items:
                            type: string
                        study_designs:
                          type: array
                          items:
                            type: string
                        categories:
                          type: array
                          items:
                            type: string
                            format: uuid
                        tags:
                          type: array
                          items:
                            type: string
                            format: uuid
                        collection_ids:
                          type: array
                          items:
                            type: string
                            format: uuid
                        source_ids:
                          type: array
                          items:
                            type: string
                            format: uuid
                        authors:
                          type: array
                          items:
                            type: string
                        publishers:
                          type: array
                          items:
                            type: string
                        published_after:
                          type: string
                          nullable: true
                        published_before:
                          type: string
                          nullable: true
                        population:
                          type: string
                          nullable: true
                        intervention:
                          type: string
                          nullable: true
                        comparator:
                          type: string
                          nullable: true
                        outcome:
                          type: string
                          nullable: true
                        country:
                          type: string
                          nullable: true
                        language:
                          type: string
                          nullable: true
                        evidence_status:
                          type: array
                          items:
                            type: string
                            enum:
                              - supported
                              - likely_supported
                              - mixed
                              - contested
                              - contradicted
                              - insufficient_evidence
                              - outdated
                              - retracted_source_dependency
                              - unreviewed
                      additionalProperties: false
                limit:
                  anyOf:
                    - not: {}
                    - type: integer
                      minimum: 1
                      maximum: 50
                include_passages:
                  anyOf:
                    - not: {}
                    - type: boolean
                  description: Return matching passages with locators.
                include_unreviewed:
                  anyOf:
                    - not: {}
                    - type: boolean
                  description: Include sources that have not been approved. They are labelled as such.
                include_archived:
                  anyOf:
                    - not: {}
                    - type: boolean
                explain_ranking:
                  anyOf:
                    - not: {}
                    - type: boolean
                  description: Return the per-signal score breakdown.
              required:
                - query
            example:
              query: What evidence do we have on post-meal walking and glucose?
              mode: library_only
              entity_types:
                - sources
                - claims
              filters:
                review_status:
                  - approved
              limit: 20
              include_passages: true
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /knowledge/synthesize:
    post:
      operationId: synthesizeKnowledge
      summary: Generate a cited answer from internal sources only
      description: >-
        Produces an evidence-backed answer built strictly from Nirog Bhoomi's own sources, with a
        citation for every factual statement.


        Use this when the user wants an answer rather than a list of results -- a cited overview, a
        comparison across retrieved evidence, or a summary of contradictions and limitations. Search
        first unless you already know which source ids to use.


        The service rejects any citation the model produced that is not in the retrieval context, so
        citations returned here always correspond to real passages. Statements whose citations were
        all invalid are dropped rather than shown uncited.


        Defaults to approved sources only. Setting approved_only to false includes unreviewed
        material, which must then be described as unreviewed in your answer. This operation does not
        use the web and does not modify anything.
      tags:
        - knowledge
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - knowledge.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  minLength: 1
                mode:
                  anyOf:
                    - not: {}
                    - type: string
                      enum:
                        - library_only
                        - library_first
                        - evidence_review
                source_ids:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
                  description: Restrict to these sources.
                collection_ids:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
                approved_only:
                  anyOf:
                    - not: {}
                    - type: boolean
                  description: Defaults to true.
                include_contradictions:
                  anyOf:
                    - not: {}
                    - type: boolean
                include_limitations:
                  anyOf:
                    - not: {}
                    - type: boolean
                include_safety_notes:
                  anyOf:
                    - not: {}
                    - type: boolean
                citation_style:
                  anyOf:
                    - not: {}
                    - type: string
                      enum:
                        - internal
                        - numbered
                        - apa
                        - vancouver
                        - harvard
                        - url_list
                        - doi_list
                        - bibtex
                        - ris
                audience:
                  anyOf:
                    - not: {}
                    - type: string
                max_sources:
                  anyOf:
                    - not: {}
                    - type: integer
                      minimum: 1
                      maximum: 30
              required:
                - question
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /knowledge/evidence:
    post:
      operationId: findEvidence
      summary: Find supporting, contradicting or qualifying evidence for a claim or question
      description: >-
        Returns evidence relevant to a specific claim or question, separated into evidence that has
        been curated and reviewed (attached to a claim record) and evidence that is only a retrieval
        match.


        Use this when the user asks whether something is supported, what contradicts it, or wants
        the exact passages behind a position. The distinction in the response matters: curated claim
        evidence has been reviewed by a person, passage evidence has not.


        This does not create or modify claims. Use createClaim or addClaimEvidence for that.
      tags:
        - knowledge
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - knowledge.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                claim_or_question:
                  type: string
                  minLength: 1
                relationship:
                  anyOf:
                    - not: {}
                    - type: string
                      enum:
                        - supporting
                        - contradicting
                        - qualifying
                        - all
                approved_only:
                  anyOf:
                    - not: {}
                    - type: boolean
                collection_ids:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
                limit:
                  anyOf:
                    - not: {}
                    - type: integer
                      minimum: 1
                      maximum: 50
              required:
                - claim_or_question
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /knowledge/compare:
    post:
      operationId: compareSources
      summary: Compare two to eight sources across methodology dimensions
      description: >-
        Builds a side-by-side comparison of the selected sources across study design, population,
        intervention, comparator, duration, outcomes, findings, limitations, funding and conflicts
        of interest.


        Use this when the user asks how studies differ, which is stronger, or why two sources seem
        to disagree. The response names which sources have no data for each dimension, and flags
        whether the study metadata was human-verified or only auto-extracted.


        Requires between two and eight source ids. This operation does not modify anything.
      tags:
        - knowledge
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - knowledge.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 2
                  maxItems: 8
                comparison_dimensions:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
              required:
                - source_ids
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /knowledge/gaps:
    post:
      operationId: findKnowledgeGaps
      summary: Identify what the library is missing on a topic
      description: >-
        Analyses the library's coverage of a topic and reports structural gaps: missing study
        designs, absent recent work, no population relevant to Nirog Bhoomi's audience, small
        samples, or missing study metadata.


        Use this when the user asks what research is missing, where the evidence is thin, or what to
        research next. Note that a reported gap can reflect missing metadata rather than missing
        research; the response says which.


        This operation does not modify anything.
      tags:
        - knowledge
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - knowledge.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic:
                  type: string
                  minLength: 1
                collection_ids:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
                approved_only:
                  anyOf:
                    - not: {}
                    - type: boolean
                dimensions:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        enum:
                          - population
                          - intervention
                          - outcomes
                          - geography
                          - study_design
                          - recency
              required:
                - topic
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sources:
    get:
      operationId: listSources
      summary: List and filter library sources
      description: >-
        Returns a filtered, paginated list of sources with their review and processing state.


        Use this for browsing and filtering -- "show sources awaiting review", "what did I add this
        week", "list everything in this collection". For relevance-ranked topic search use
        searchKnowledge instead; this operation does not rank by relevance to a question.


        This operation does not modify anything.
      tags:
        - sources
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - source.read
        - knowledge.read
      parameters:
        - name: query
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: review_status
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - allOf:
                  - anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  - type: array
                    items:
                      type: string
                      minLength: 1
        - name: processing_status
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - allOf:
                  - anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  - type: array
                    items:
                      type: string
                      minLength: 1
        - name: source_type
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - allOf:
                  - anyOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  - type: array
                    items:
                      type: string
                      minLength: 1
        - name: category_id
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: tag_id
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: collection_id
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: publisher
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: author
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: published_after
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: published_before
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: added_by
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: assigned_reviewer_id
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: uuid
        - name: archived
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: duplicates_only
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: limit
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: integer
                minimum: 1
                maximum: 100
        - name: sort
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                enum:
                  - created_at
                  - updated_at
                  - publication_date
                  - title
        - name: order
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                enum:
                  - asc
                  - desc
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createSource
      summary: Create a source from supplied text rather than a URL
      description: >-
        Creates a source record from text you already have -- a manual note, pasted article text, an
        internal document, or a citation with no retrievable URL.


        Use this when there is no URL to fetch, or when the publisher blocks automated access and
        the user has supplied the text. For a URL, use ingestUrl instead: it captures the original
        and its metadata.


        This operation writes. The created source is unreviewed.
      tags:
        - sources
        - ingestion
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - source.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                source_type:
                  anyOf:
                    - not: {}
                    - type: string
                  description: Defaults to manual_note.
                text:
                  type: string
                  minLength: 1
                original_url:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                authors:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                publisher:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                publication_date:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                abstract:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                categories:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
                tags:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                collection_ids:
                  anyOf:
                    - not: {}
                    - type: array
                      items:
                        type: string
                        format: uuid
              required:
                - title
                - text
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: A client-generated key that makes a retried write safe to repeat.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sources/{sourceId}:
    get:
      operationId: getSource
      summary: Get one source with its metadata, taxonomy and optional detail
      description: >-
        Returns the full record for one source: metadata, summaries, categories, tags, collections,
        review state and processing state.


        Use this when a specific source has been identified and you need its details, or before
        proposing an edit. The optional include flags add study metadata, claims, annotations,
        versions and activity.


        Full text is not returned by default and is truncated when requested; use
        searchSourcePassages to retrieve specific passages with locators rather than pulling the
        whole document.


        This operation does not modify anything.
      tags:
        - sources
      x-risk-level: low
      x-may-require-confirmation: false
      x-required-scopes:
        - source.read
        - knowledge.read
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: include_text
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_study_metadata
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_claims
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_annotations
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_versions
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
        - name: include_activity
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: boolean
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                    additionalProperties: true
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateSource
      summary: Correct editable metadata on a source
      description: >-
        Updates editable metadata fields on an existing source: title, authors, publisher,
        publication date, DOI, abstract, human summary, key findings, limitations, safety notes and
        similar.


        Use this only when the user explicitly asks to correct or change source metadata.


        This action does NOT change review status (use changeSourceReviewStatus), categories or tags
        (use updateSourceTaxonomy), or collection membership (use addSourceToCollections). Fields a
        reviewer has locked cannot be changed without the source.lock_fields permission.


        Pass expected_version to detect a concurrent edit; a mismatch returns VERSION_CONFLICT
        rather than overwriting someone else's change.


        This operation writes.
      tags:
        - sources
      x-risk-level: medium
      x-may-require-confirmation: false
      x-required-scopes:
        - source.write
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version:
                  anyOf:
                    - not: {}
                    - type: integer
                title:
                  anyOf:
                    - not: {}
                    - type: string
                subtitle:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                source_type:
                  anyOf:
                    - not: {}
                    - type: string
                canonical_url:
                  anyOf:
                    - not: {}
                    - type: string
                      nullable: true
                doi:
                  anyOf:
