name: Source recovery audit

on:
  push:
    branches:
      - qa/source-recovery-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Audit production source records
        run: npx tsx scripts/audit-source-recovery.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Attempt Appwrite project resume
        continue-on-error: true
        run: npx tsx scripts/try-resume-appwrite.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}

      - name: Audit Neon SQL recovery capabilities
        run: npx tsx scripts/audit-neon-recovery.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Audit DB role and retained source storage
        run: npx tsx scripts/audit-storage-recovery.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_BUCKET_ID: ${{ secrets.APPWRITE_BUCKET_ID }}
