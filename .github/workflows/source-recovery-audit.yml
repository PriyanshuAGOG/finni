name: Source recovery audit

on:
  push:
    branches:
      - qa/source-recovery-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Audit production source records
        run: npx tsx scripts/audit-source-recovery.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
