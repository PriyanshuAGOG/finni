name: Final dependency audit

on:
  push:
    branches:
      - qa/final-platform-audit
    paths:
      - '.github/workflows/final-dependency-audit.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --json
